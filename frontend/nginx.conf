server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API -> backend container. $proxy_add_x_forwarded_for APPENDS the real peer
    # address as the last entry; the backend's rate limiter trusts only that last
    # entry (TRUST_PROXY_HEADERS=true), so a spoofed header can't dodge limits.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: any other path serves index.html so client-side routes survive a refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
